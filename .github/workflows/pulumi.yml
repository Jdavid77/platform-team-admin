name: Pulumi Infrastructure

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Tag"]
    types:
      - completed

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint-code:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting with black
        run: uv run black --check --diff .

      - name: Type check with mypy
        run: uv run mypy . --ignore-missing-imports

  # ── Static analysis ───────────────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Security scan with bandit
        run: uv run bandit -r . -ll --exclude ./.venv

  # ── Pulumi preview ────────────────────────────────────────────────────────────
  pulumi-preview:
    runs-on: ubuntu-latest
    needs: [lint-code, static-analysis]
    environment: pulumi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: Jdavid77/platformteamadministration/dev
          color: always
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # ── Manual approval gate ──────────────────────────────────────────────────────
  approve-deployment:
    needs: pulumi-preview
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: pulumi-production
    steps:
      - run: echo "Deployment approved"

  # ── Deploy ────────────────────────────────────────────────────────────────────
  pulumi-up:
    needs: approve-deployment
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: pulumi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: Jdavid77/platformteamadministration/dev
          color: always
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
